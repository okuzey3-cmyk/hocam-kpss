<meta name="description" content="KPSS Ortaöğretim sınavına basit örneklerle anlatan, sonra soru soran kişisel öğretmen uygulaması" />

<!-- PWA / Ana ekrana ekleme desteği -->
<meta name="theme-color" content="#16302E" />

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316302E'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Georgia,serif' fill='%23C9973B' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316302E'/%3E%3Ctext x='50' y='68' font-size='54' font-family='Georgia,serif' fill='%23C9973B' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #FBFAF7; }
  body { min-height: 100vh; }
  #root { min-height: 100vh; }

<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect } = React;

/* ---------- localStorage tabanlı kalıcı hafıza ---------- */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

/* ---------- basit ikonlar (lucide yerine, bağımsız çalışsın diye) ---------- */
function Icon({ path, size = 16, color = "currentColor", children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
}
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const ArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></Icon>;
const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></Icon>;
const Flame = (p) => <Icon {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></Icon>;
const Repeat = (p) => <Icon {...p}><polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 0 1 4-4h14" /><polyline points="7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></Icon>;

const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');`;
const STORAGE_KEY = "hocam:progress";

const TOKENS = {
  bg: "#FBFAF7",
  ink: "#16302E",
  inkSoft: "#4B615F",
  accent: "#C9973B",
  accentSoft: "#F1E4C4",
  correct: "#1E8A4C",
  correctSoft: "#DCF2E3",
  error: "#D6392E",
  errorSoft: "#FBDBD7",
  border: "#DDD8C8",
  card: "#FFFFFF",
};

const SUBJECTS = [
  { id: "turkce", label: "Türkçe" },
  { id: "matematik", label: "Matematik" },
  { id: "tarih", label: "Tarih" },
  { id: "cografya", label: "Coğrafya" },
  { id: "vatandaslik", label: "Vatandaşlık" },
];

const DIAGNOSTIC = [
  { subject: "turkce", q: "\"Onun bu konudaki tavrı, tıpkı rüzgara göre yön değiştiren bir fırıldak gibiydi.\" cümlesindeki altı çizili söz, kişinin hangi özelliğini anlatır?", options: ["Kararlı oluşunu", "Tutarsız, değişken oluşunu", "Cesur oluşunu", "Sabırlı oluşunu"], correct: 1 },
  { subject: "turkce", q: "Aşağıdakilerin hangisinde bir yazım yanlışı vardır?", options: ["Yalnız kaldım.", "Herşey yolunda.", "Bir şey söyle.", "Hiçbir şey anlamadım."], correct: 1 },
  { subject: "matematik", q: "Bir ürünün etiket fiyatı 400 TL'dir. %25 indirimle satılırsa satış fiyatı kaç TL olur?", options: ["300", "320", "350", "375"], correct: 0 },
  { subject: "matematik", q: "3 işçi bir işi 12 günde bitiriyorsa, aynı işi 4 işçi kaç günde bitirir?", options: ["8", "9", "10", "16"], correct: 1 },
  { subject: "tarih", q: "Türk tarihinde ilk anayasa hareketi kabul edilen belge aşağıdakilerden hangisidir?", options: ["Tanzimat Fermanı", "Islahat Fermanı", "Kanun-i Esasi", "Sened-i İttifak"], correct: 2 },
  { subject: "tarih", q: "TBMM'nin açılışı hangi tarihte gerçekleşmiştir?", options: ["19 Mayıs 1919", "23 Nisan 1920", "29 Ekim 1923", "30 Ağustos 1922"], correct: 1 },
  { subject: "cografya", q: "Türkiye'de en fazla yağış alan bölge hangisidir?", options: ["İç Anadolu", "Karadeniz", "Güneydoğu Anadolu", "İç Ege"], correct: 1 },
  { subject: "cografya", q: "Aşağıdakilerden hangisi Türkiye'nin komşularından biri değildir?", options: ["Gürcistan", "Ermenistan", "Ukrayna", "İran"], correct: 2 },
  { subject: "vatandaslik", q: "Anayasaya göre yasama yetkisi kime aittir?", options: ["Cumhurbaşkanına", "Bakanlar Kuruluna", "Türk Milleti adına TBMM'ye", "Anayasa Mahkemesine"], correct: 2 },
  { subject: "vatandaslik", q: "Bir kanunun Anayasaya uygunluğunu denetleyen organ hangisidir?", options: ["Danıştay", "Yargıtay", "Anayasa Mahkemesi", "Sayıştay"], correct: 2 },
];

const TOPIC = {
  id: "yuzde",
  subject: "matematik",
  title: "Yüzde Problemleri",
  everyday: {
    heading: "Önce günlük hayattan bir örnekle bakalım",
    body:
      "Markete gittin, bir ceket 500 TL. Üzerinde \"%20 indirim\" yazıyor. Bu ne demek? " +
      "\"Yüzde\" aslında \"100'de kaç tane\" demek. Yani 100 TL'lik bir şeyin 20 TL'si indirimli. " +
      "500 TL'yi 100'e bölüp (5 TL), sonra 20 ile çarparsan (5 × 20 = 100 TL), indirim tutarını bulursun. " +
      "Ceketin yeni fiyatı: 500 − 100 = 400 TL.",
  },
  approach: {
    heading: "Bu tür soruya nasıl yaklaşmalısın?",
    steps: [
      "Sorunun \"bütünü\" (tamamı, %100'ü) neresi, onu bul. Genelde bu, indirim ya da artıştan ÖNCEKİ fiyat ya da miktardır.",
      "\"Yüzde X\" ifadesini gördüğünde, bunu bir kesire çevir: %20 → 20/100 → 0,20.",
      "\"Bütün × oran\" işlemini yap. Bu sana \"yüzdenin karşılığı olan sayıyı\" verir.",
      "Soru \"indirimli fiyat\" mı, \"indirim tutarı\" mı, \"artan miktar\" mı soruyor — dikkatle oku, hangisini istediğini işaretle.",
    ],
    tip:
      "Küçük bir hile: \"%25 indirim\" gördüğünde direkt \"fiyatın 4'te 1'i gidiyor, yani kalan 4'te 3'ü\" diye düşünebilirsin. " +
      "Yüzdeleri basit kesirlere çevirmek (25%=1/4, 50%=1/2, 10%=1/10) işlemi çok hızlandırır.",
  },
  practice: [
    { q: "Bir telefonun fiyatı 8.000 TL. %15 indirimle kaç TL'ye satılır?", options: ["6.800 TL", "6.900 TL", "7.000 TL", "7.200 TL"], correct: 0, explain: "8.000'in %15'i: 8.000 ÷ 100 = 80, sonra 80 × 15 = 1.200 TL indirim. 8.000 − 1.200 = 6.800 TL." },
    { q: "Bir mağazada fiyatı %40 artan bir üründe, ürün önceden 250 TL ise yeni fiyat kaç TL olur?", options: ["290 TL", "300 TL", "325 TL", "350 TL"], correct: 3, explain: "250'nin %40'ı: 250 ÷ 100 = 2,5, sonra 2,5 × 40 = 100 TL artış. 250 + 100 = 350 TL." },
    { q: "Bir sınıftaki 40 öğrencinin %30'u kız öğrencidir. Kız öğrenci sayısı kaçtır?", options: ["10", "12", "14", "16"], correct: 1, explain: "40'ın %30'u: 40 ÷ 100 = 0,4, sonra 0,4 × 30 = 12 kız öğrenci." },
  ],
};

function Shell({ children }) {
  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: TOKENS.bg, color: TOKENS.ink, minHeight: "100vh", width: "100%" }}>
      <style>{`
        ${FONT_IMPORT}
        .serif { font-family: 'Lora', serif; }
        .opt-btn { transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease; }
        .opt-btn:active { transform: scale(0.99); }
        .primary-btn:hover { opacity: 0.92; }
      `}</style>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "28px 20px 60px" }}>{children}</div>
    </div>
  );
}

function Header({ eyebrow, title }) {
  return (
    <div style={{ marginBottom: 28 }}>
      {eyebrow && <div style={{ fontSize: 13, color: TOKENS.accent, fontWeight: 600, marginBottom: 6 }}>{eyebrow}</div>}
      <h1 className="serif" style={{ fontSize: 26, fontWeight: 700, margin: 0, lineHeight: 1.3 }}>{title}</h1>
    </div>
  );
}

function PrimaryButton({ children, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled} className="primary-btn"
      style={{
        background: disabled ? TOKENS.border : TOKENS.ink,
        color: disabled ? TOKENS.inkSoft : "#FBFAF7",
        border: "none", borderRadius: 8, padding: "13px 22px", fontSize: 15, fontWeight: 600,
        fontFamily: "'Inter', sans-serif", cursor: disabled ? "not-allowed" : "pointer",
        display: "inline-flex", alignItems: "center", gap: 8,
      }}>
      {children}
    </button>
  );
}

function HocamApp() {
  const [view, setView] = useState("intro");
  const [dIndex, setDIndex] = useState(0);
  const [dAnswers, setDAnswers] = useState([]);
  const [dSelected, setDSelected] = useState(null);
  const [dRevealed, setDRevealed] = useState(false);

  const [tStage, setTStage] = useState("everyday");
  const [pIndex, setPIndex] = useState(0);
  const [pSelected, setPSelected] = useState(null);
  const [pRevealed, setPRevealed] = useState(false);
  const [pCorrectCount, setPCorrectCount] = useState(0);
  const [wrongPool, setWrongPool] = useState([]);
  const [reviewQueue, setReviewQueue] = useState([]);
  const [reviewIndex, setReviewIndex] = useState(0);
  const [reviewSelected, setReviewSelected] = useState(null);
  const [reviewRevealed, setReviewRevealed] = useState(false);
  const [reviewMissedAgain, setReviewMissedAgain] = useState([]);

  const [streak, setStreak] = useState(0);
  const [bestScore, setBestScore] = useState(null);
  const [progressLoaded, setProgressLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const today = new Date().toISOString().slice(0, 10);
      let data = null;
      try {
        const res = await window.storage.get(STORAGE_KEY);
        data = res ? JSON.parse(res.value) : null;
      } catch (e) { data = null; }
      let nextStreak = 1;
      if (data && data.lastVisit) {
        const last = new Date(data.lastVisit);
        const diffDays = Math.round((new Date(today) - last) / 86400000);
        if (diffDays === 0) nextStreak = data.streak || 1;
        else if (diffDays === 1) nextStreak = (data.streak || 0) + 1;
        else nextStreak = 1;
      }
      setStreak(nextStreak);
      if (data && data.topicScores && data.topicScores[TOPIC.id]) setBestScore(data.topicScores[TOPIC.id]);
      setProgressLoaded(true);
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({ ...(data || {}), lastVisit: today, streak: nextStreak }));
      } catch (e) {}
    })();
  }, []);

  async function saveTopicScore(correctCount, total) {
    try {
      const res = await window.storage.get(STORAGE_KEY).catch(() => null);
      const data = res ? JSON.parse(res.value) : {};
      const prevBest = data.topicScores && data.topicScores[TOPIC.id];
      const newEntry = prevBest && prevBest.correct >= correctCount ? prevBest : { correct: correctCount, total };
      const updated = { ...data, topicScores: { ...(data.topicScores || {}), [TOPIC.id]: newEntry } };
      await window.storage.set(STORAGE_KEY, JSON.stringify(updated));
      setBestScore(newEntry);
    } catch (e) {}
  }

  function selectDiagnosticOption(i) { if (!dRevealed) setDSelected(i); }
  function confirmDiagnostic() {
    if (dSelected === null) return;
    setDRevealed(true);
    setDAnswers((prev) => [...prev, { subject: DIAGNOSTIC[dIndex].subject, correct: dSelected === DIAGNOSTIC[dIndex].correct }]);
  }
  function nextDiagnostic() {
    if (dIndex + 1 < DIAGNOSTIC.length) { setDIndex(dIndex + 1); setDSelected(null); setDRevealed(false); }
    else setView("results");
  }
  function subjectScore(subjectId) {
    const items = dAnswers.filter((a) => a.subject === subjectId);
    return { correct: items.filter((a) => a.correct).length, total: items.length };
  }
  function weakestSubject() {
    let weakest = null, lowestRatio = 2;
    for (const s of SUBJECTS) {
      const { correct, total } = subjectScore(s.id);
      if (total === 0) continue;
      const ratio = correct / total;
      if (ratio < lowestRatio) { lowestRatio = ratio; weakest = s; }
    }
    return weakest;
  }

  function selectPracticeOption(i) { if (!pRevealed) setPSelected(i); }
  function confirmPractice() {
    if (pSelected === null) return;
    setPRevealed(true);
    if (pSelected === TOPIC.practice[pIndex].correct) setPCorrectCount((c) => c + 1);
    else setWrongPool((prev) => [...prev, TOPIC.practice[pIndex]]);
  }
  function nextPractice() {
    if (pIndex + 1 < TOPIC.practice.length) { setPIndex(pIndex + 1); setPSelected(null); setPRevealed(false); }
    else { saveTopicScore(pCorrectCount, TOPIC.practice.length); setView("topic-done"); }
  }

  function startReview() {
    setReviewQueue(wrongPool); setReviewIndex(0); setReviewSelected(null); setReviewRevealed(false); setView("review");
  }
  function selectReviewOption(i) { if (!reviewRevealed) setReviewSelected(i); }
  function confirmReview() {
    if (reviewSelected === null) return;
    setReviewRevealed(true);
    if (reviewSelected !== reviewQueue[reviewIndex].correct) setReviewMissedAgain((prev) => [...prev, reviewQueue[reviewIndex]]);
  }
  function nextReview() {
    if (reviewIndex + 1 < reviewQueue.length) { setReviewIndex(reviewIndex + 1); setReviewSelected(null); setReviewRevealed(false); }
    else if (reviewMissedAgain.length > 0) {
      setReviewQueue(reviewMissedAgain); setReviewMissedAgain([]); setReviewIndex(0); setReviewSelected(null); setReviewRevealed(false);
    } else { setWrongPool([]); setView("topic-done"); }
  }

  function restartAll() {
    setView("intro"); setDIndex(0); setDAnswers([]); setDSelected(null); setDRevealed(false);
    setTStage("everyday"); setPIndex(0); setPSelected(null); setPRevealed(false); setPCorrectCount(0);
    setWrongPool([]); setReviewQueue([]); setReviewIndex(0); setReviewSelected(null); setReviewRevealed(false); setReviewMissedAgain([]);
  }

  if (view === "intro") {
    return (
      <Shell>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: TOKENS.accent }}>KPSS ORTAÖĞRETİM</div>
          {progressLoaded && streak > 1 && (
            <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 13, fontWeight: 600, color: TOKENS.accent }}>
              <Flame size={15} color={TOKENS.accent} />{streak} gün üst üste
            </div>
          )}
        </div>
        <h1 className="serif" style={{ fontSize: 32, lineHeight: 1.25, margin: "0 0 14px" }}>Hocam</h1>
        <p style={{ fontSize: 16, lineHeight: 1.6, color: TOKENS.inkSoft, marginBottom: 20 }}>
          Önce nerede durduğunu görelim, sonra seni en zayıf olduğun konudan başlayarak, basit örneklerle anlata anlata sınava hazırlayayım.
        </p>
        {bestScore && (
          <div style={{ background: TOKENS.accentSoft, borderRadius: 10, padding: "12px 16px", marginBottom: 20, fontSize: 14, color: TOKENS.ink }}>
            "{TOPIC.title}" konusunda en iyi skorun: <strong>{bestScore.correct}/{bestScore.total}</strong>
          </div>
        )}
        <div style={{ background: TOKENS.card, border: `1px solid ${TOKENS.border}`, borderRadius: 12, padding: 20, marginBottom: 28 }}>
          <div className="serif" style={{ fontWeight: 600, marginBottom: 10, fontSize: 16 }}>Kısa bir seviye tespiti ile başlıyoruz</div>
          <div style={{ fontSize: 14, color: TOKENS.inkSoft, lineHeight: 1.6 }}>
            Türkçe, Matematik, Tarih, Coğrafya ve Vatandaşlık'tan 2'şer soru — toplam 10 soru, yaklaşık 5 dakika.
          </div>
        </div>
        <PrimaryButton onClick={() => setView("diagnostic")}>Başla <ArrowRight size={16} /></PrimaryButton>
      </Shell>
    );
  }

  if (view === "diagnostic") {
    const item = DIAGNOSTIC[dIndex];
    const subjectLabel = SUBJECTS.find((s) => s.id === item.subject).label;
    return (
      <Shell>
        <div style={{ fontSize: 13, color: TOKENS.inkSoft, marginBottom: 6 }}>{dIndex + 1} / {DIAGNOSTIC.length} · {subjectLabel}</div>
        <div style={{ height: 4, background: TOKENS.border, borderRadius: 2, marginBottom: 24, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${((dIndex + (dRevealed ? 1 : 0)) / DIAGNOSTIC.length) * 100}%`, background: TOKENS.accent, transition: "width 0.3s ease" }} />
        </div>
        <p className="serif" style={{ fontSize: 19, lineHeight: 1.5, marginBottom: 20 }}>{item.q}</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
          {item.options.map((opt, i) => {
            const isCorrect = dRevealed && i === item.correct;
            const isWrongSelected = dRevealed && i === dSelected && i !== item.correct;
            return (
              <button key={i} className="opt-btn" onClick={() => selectDiagnosticOption(i)}
                style={{
                  textAlign: "left", padding: "13px 16px", borderRadius: 8,
                  border: `2px solid ${isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : dSelected === i ? TOKENS.ink : TOKENS.border}`,
                  background: isCorrect ? TOKENS.correctSoft : isWrongSelected ? TOKENS.errorSoft : dSelected === i ? "#F2F0EA" : TOKENS.card,
                  fontSize: 15, fontFamily: "'Inter', sans-serif", fontWeight: isCorrect || isWrongSelected ? 600 : 400,
                  color: isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : TOKENS.ink,
                  cursor: dRevealed ? "default" : "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                <span>{opt}</span>
                {isCorrect && <Check size={18} color={TOKENS.correct} />}
                {isWrongSelected && <X size={18} color={TOKENS.error} />}
              </button>
            );
          })}
        </div>
        {!dRevealed ? (
          <PrimaryButton onClick={confirmDiagnostic} disabled={dSelected === null}>Cevapla</PrimaryButton>
        ) : (
          <PrimaryButton onClick={nextDiagnostic}>{dIndex + 1 < DIAGNOSTIC.length ? "Sonraki soru" : "Sonuçları gör"} <ArrowRight size={16} /></PrimaryButton>
        )}
      </Shell>
    );
  }

  if (view === "results") {
    const weak = weakestSubject();
    return (
      <Shell>
        <Header eyebrow="SEVİYE TESPİTİ TAMAM" title="İşte durumun" />
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 26 }}>
          {SUBJECTS.map((s) => {
            const { correct, total } = subjectScore(s.id);
            const isWeak = weak && weak.id === s.id;
            return (
              <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 16px", borderRadius: 8, border: `1px solid ${isWeak ? TOKENS.accent : TOKENS.border}`, background: isWeak ? TOKENS.accentSoft : TOKENS.card }}>
                <span style={{ fontSize: 15, fontWeight: isWeak ? 600 : 500 }}>{s.label}</span>
                <span style={{ fontSize: 14, color: TOKENS.inkSoft }}>{correct}/{total} doğru</span>
              </div>
            );
          })}
        </div>
        <div style={{ background: TOKENS.card, border: `1px solid ${TOKENS.border}`, borderRadius: 12, padding: 20, marginBottom: 26 }}>
          <div className="serif" style={{ fontWeight: 600, fontSize: 16, marginBottom: 8 }}>Önerim</div>
          <p style={{ fontSize: 14, lineHeight: 1.6, color: TOKENS.inkSoft, margin: 0 }}>
            {weak
              ? `${weak.label} konusunda daha çok çalışman gerekiyor gibi görünüyor. Bu demo'da sana Matematik'ten "Yüzde Problemleri" konusunu, tam olarak istediğin şekilde — önce basit bir örnekle, sonra nasıl yaklaşman gerektiğini anlatarak, sonunda soru-cevapla — göstereceğim.`
              : "Genel olarak dengeli görünüyorsun. Matematik'ten bir örnek konuyla devam edelim."}
          </p>
        </div>
        <PrimaryButton onClick={() => setView("topic")}>Yüzde Problemleri'ni öğren <ArrowRight size={16} /></PrimaryButton>
      </Shell>
    );
  }

  if (view === "topic") {
    if (tStage === "everyday") {
      return (
        <Shell>
          <Header eyebrow="MATEMATİK" title={TOPIC.title} />
          <div style={{ background: TOKENS.card, border: `1px solid ${TOKENS.border}`, borderRadius: 12, padding: 22, marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <BookOpen size={17} color={TOKENS.accent} />
              <span className="serif" style={{ fontWeight: 600, fontSize: 16 }}>{TOPIC.everyday.heading}</span>
            </div>
            <p style={{ fontSize: 15, lineHeight: 1.7, color: TOKENS.ink, margin: 0 }}>{TOPIC.everyday.body}</p>
          </div>
          <PrimaryButton onClick={() => setTStage("approach")}>Peki soruya nasıl bakmalıyım? <ArrowRight size={16} /></PrimaryButton>
        </Shell>
      );
    }
    if (tStage === "approach") {
      return (
        <Shell>
          <Header eyebrow="MATEMATİK" title={TOPIC.title} />
          <div style={{ background: TOKENS.card, border: `1px solid ${TOKENS.border}`, borderRadius: 12, padding: 22, marginBottom: 18 }}>
            <div className="serif" style={{ fontWeight: 600, fontSize: 16, marginBottom: 14 }}>{TOPIC.approach.heading}</div>
            <ol style={{ margin: 0, paddingLeft: 20, display: "flex", flexDirection: "column", gap: 12 }}>
              {TOPIC.approach.steps.map((s, i) => <li key={i} style={{ fontSize: 15, lineHeight: 1.6, color: TOKENS.ink }}>{s}</li>)}
            </ol>
          </div>
          <div style={{ background: TOKENS.accentSoft, borderRadius: 12, padding: 18, marginBottom: 24, fontSize: 14, lineHeight: 1.6, color: TOKENS.ink }}>
            <strong>İpucu:</strong> {TOPIC.approach.tip}
          </div>
          <PrimaryButton onClick={() => setTStage("practice")}>Şimdi soru çözelim <ArrowRight size={16} /></PrimaryButton>
        </Shell>
      );
    }
    if (tStage === "practice") {
      const item = TOPIC.practice[pIndex];
      return (
        <Shell>
          <div style={{ fontSize: 13, color: TOKENS.inkSoft, marginBottom: 6 }}>Soru {pIndex + 1} / {TOPIC.practice.length}</div>
          <div style={{ height: 4, background: TOKENS.border, borderRadius: 2, marginBottom: 24, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${((pIndex + (pRevealed ? 1 : 0)) / TOPIC.practice.length) * 100}%`, background: TOKENS.accent, transition: "width 0.3s ease" }} />
          </div>
          <p className="serif" style={{ fontSize: 18, lineHeight: 1.5, marginBottom: 20 }}>{item.q}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
            {item.options.map((opt, i) => {
              const isCorrect = pRevealed && i === item.correct;
              const isWrongSelected = pRevealed && i === pSelected && i !== item.correct;
              return (
                <button key={i} className="opt-btn" onClick={() => selectPracticeOption(i)}
                  style={{
                    textAlign: "left", padding: "13px 16px", borderRadius: 8,
                    border: `2px solid ${isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : pSelected === i ? TOKENS.ink : TOKENS.border}`,
                    background: isCorrect ? TOKENS.correctSoft : isWrongSelected ? TOKENS.errorSoft : pSelected === i ? "#F2F0EA" : TOKENS.card,
                    fontSize: 15, fontFamily: "'Inter', sans-serif", fontWeight: isCorrect || isWrongSelected ? 600 : 400,
                    color: isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : TOKENS.ink,
                    cursor: pRevealed ? "default" : "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
                  }}>
                  <span>{opt}</span>
                  {isCorrect && <Check size={18} color={TOKENS.correct} />}
                  {isWrongSelected && <X size={18} color={TOKENS.error} />}
                </button>
              );
            })}
          </div>
          {pRevealed && (
            <div style={{ background: "#F2F0EA", borderRadius: 10, padding: 16, marginBottom: 20, fontSize: 14, lineHeight: 1.6, color: TOKENS.inkSoft }}>{item.explain}</div>
          )}
          {!pRevealed ? (
            <PrimaryButton onClick={confirmPractice} disabled={pSelected === null}>Cevapla</PrimaryButton>
          ) : (
            <PrimaryButton onClick={nextPractice}>{pIndex + 1 < TOPIC.practice.length ? "Sonraki soru" : "Bitir"} <ArrowRight size={16} /></PrimaryButton>
          )}
        </Shell>
      );
    }
  }

  if (view === "topic-done") {
    return (
      <Shell>
        <Header eyebrow="TAMAMLANDI" title="Yüzde Problemleri bitti" />
        <div style={{ background: TOKENS.card, border: `1px solid ${TOKENS.border}`, borderRadius: 12, padding: 22, marginBottom: 20, textAlign: "center" }}>
          <div className="serif" style={{ fontSize: 34, fontWeight: 700, marginBottom: 6 }}>{pCorrectCount} / {TOPIC.practice.length}</div>
          <div style={{ fontSize: 14, color: TOKENS.inkSoft }}>doğru cevap</div>
        </div>
        {wrongPool.length > 0 && (
          <div style={{ background: TOKENS.errorSoft, borderRadius: 12, padding: 18, marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
            <div style={{ fontSize: 14, color: TOKENS.ink, lineHeight: 1.5 }}>{wrongPool.length} soruyu yanlış yaptın. İstersen sadece onları tekrar çözelim.</div>
            <button onClick={startReview} style={{ background: TOKENS.error, color: "#FFF", border: "none", borderRadius: 8, padding: "10px 14px", fontSize: 13, fontWeight: 600, fontFamily: "'Inter', sans-serif", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
              <Repeat size={15} /> Tekrar çöz
            </button>
          </div>
        )}
        <p style={{ fontSize: 14, lineHeight: 1.6, color: TOKENS.inkSoft, marginBottom: 26 }}>
          Bu, uygulamanın ilk deneme sürümü — akış tam istediğin gibi çalışıyor mu bir bak: önce basit örnek, sonra yaklaşım, sonra soru-cevap.
          Beğenirsen, aynı kalıpla Matematik'in diğer konularını ve sonra sırayla Türkçe, Tarih, Coğrafya, Vatandaşlık'ı birlikte ekleyelim.
        </p>
        <PrimaryButton onClick={restartAll}><RotateCcw size={16} /> Baştan başla</PrimaryButton>
      </Shell>
    );
  }

  if (view === "review") {
    const item = reviewQueue[reviewIndex];
    if (!item) return null;
    return (
      <Shell>
        <div style={{ fontSize: 13, color: TOKENS.error, fontWeight: 600, marginBottom: 6 }}>Tekrar · Soru {reviewIndex + 1} / {reviewQueue.length}</div>
        <div style={{ height: 4, background: TOKENS.border, borderRadius: 2, marginBottom: 24, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${((reviewIndex + (reviewRevealed ? 1 : 0)) / reviewQueue.length) * 100}%`, background: TOKENS.error, transition: "width 0.3s ease" }} />
        </div>
        <p className="serif" style={{ fontSize: 18, lineHeight: 1.5, marginBottom: 20 }}>{item.q}</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          {item.options.map((opt, i) => {
            const isCorrect = reviewRevealed && i === item.correct;
            const isWrongSelected = reviewRevealed && i === reviewSelected && i !== item.correct;
            return (
              <button key={i} className="opt-btn" onClick={() => selectReviewOption(i)}
                style={{
                  textAlign: "left", padding: "13px 16px", borderRadius: 8,
                  border: `2px solid ${isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : reviewSelected === i ? TOKENS.ink : TOKENS.border}`,
                  background: isCorrect ? TOKENS.correctSoft : isWrongSelected ? TOKENS.errorSoft : reviewSelected === i ? "#F2F0EA" : TOKENS.card,
                  fontSize: 15, fontFamily: "'Inter', sans-serif", fontWeight: isCorrect || isWrongSelected ? 600 : 400,
                  color: isCorrect ? TOKENS.correct : isWrongSelected ? TOKENS.error : TOKENS.ink,
                  cursor: reviewRevealed ? "default" : "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                <span>{opt}</span>
                {isCorrect && <Check size={18} color={TOKENS.correct} />}
                {isWrongSelected && <X size={18} color={TOKENS.error} />}
              </button>
            );
          })}
        </div>
        {reviewRevealed && (
          <div style={{ background: "#F2F0EA", borderRadius: 10, padding: 16, marginBottom: 20, fontSize: 14, lineHeight: 1.6, color: TOKENS.inkSoft }}>{item.explain}</div>
        )}
        {!reviewRevealed ? (
          <PrimaryButton onClick={confirmReview} disabled={reviewSelected === null}>Cevapla</PrimaryButton>
        ) : (
          <PrimaryButton onClick={nextReview}>{reviewIndex + 1 < reviewQueue.length || reviewMissedAgain.length > 0 ? "Sonraki soru" : "Bitir"} <ArrowRight size={16} /></PrimaryButton>
        )}
      </Shell>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<HocamApp />);
</script>

<script>
  // Babel'in yeni sürümü otomatik JSX runtime kullanıp "react/jsx-runtime"
  // import etmeye çalışıyor; bu ortamda modül çözümleyici olmadığı için
  // hata veriyor. Bu yüzden dönüşümü elle, klasik (React.createElement)
  // modda çalıştırıp sonucu normal bir script olarak sayfaya ekliyoruz.
  const sourceCode = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  const runnable = document.createElement("script");
  runnable.textContent = compiled;
  document.body.appendChild(runnable);
</script>
</body>
</html>
